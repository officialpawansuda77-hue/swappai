# Keeps the background-removal server (rembg service used for HD mode) awake.
# Free instances (e.g. on Render) spin down after 15 mins of inactivity.
#
# Defaults to the live Render service:
# https://swappai-bg-removal.onrender.com
name: Keep background-removal server awake

on:
  schedule:
    - cron: '*/14 * * * *' # Every 14 minutes to prevent Render free-tier spin down
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping server
        env:
          TARGET_URL: "https://swappai-bg-removal.onrender.com"
        run: |
          echo "Pinging background removal server at $TARGET_URL..."
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${TARGET_URL%/}/health" || curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${TARGET_URL%/}/" || true)
          echo "Server responded with HTTP $code"
